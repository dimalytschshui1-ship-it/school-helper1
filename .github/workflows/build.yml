name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build School Helper APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-virtualenv \
            autoconf \
            automake \
            autopoint \
            build-essential \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            lbzip2

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0
          python -m pip install cython==0.29.34

      - name: Check Buildozer
        run: |
          buildozer --version
          python --version
          cython --version

      - name: Prepare Android build environment
        run: |
          mkdir -p "$HOME/.buildozer"
          rm -rf .buildozer
          rm -rf bin

      - name: Download and check p4a
        run: |
          buildozer android p4a -- --help

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show build log on failure
        if: failure()
        run: |
          echo "===== LAST 200 LINES OF BUILD LOG ====="
          tail -n 200 build.log || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SchoolHelper-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SchoolHelper-Build-Log
          path: build.log
          if-no-files-found: ignore
